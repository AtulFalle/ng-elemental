<div class="docs-shell">
  <header class="docs-header">
    <a routerLink="/" class="docs-header__brand">
      <span class="docs-header__logo">NgElemental</span>
      <span class="docs-header__version">v{{ version }}</span>
    </a>

    <nav class="docs-header__links" aria-label="Site">
      <a routerLink="/docs" class="docs-header__link">Docs</a>
      <a
        href="https://github.com/AtulFalle/ng-elemental"
        target="_blank"
        rel="noopener"
        class="docs-header__link"
      >GitHub</a>
    </nav>

    <div class="docs-header__actions">
      <app-docs-search />
    </div>
  </header>

  <aside class="docs-sidebar">
    <el-nav
      appearance="rail"
      size="sm"
      [value]="activePath()"
      (valueChange)="onNavValueChange($event)"
      ariaLabel="Documentation"
    >
      @for (section of sections; track section.title) {
        <el-nav-heading>{{ section.title }}</el-nav-heading>
        @for (item of section.items; track item.path) {
          <el-nav-item [value]="item.path" [label]="item.label" />
        }
      }
    </el-nav>

    <button
      type="button"
      class="docs-theme-open"
      (click)="themeOpen.set(true)"
    >
      Theme
      @if (docsTheme.isCustom()) {
        <span class="docs-theme-open__hint">custom theme on</span>
      }
    </button>
  </aside>

  <main class="docs-main">
    <router-outlet />
  </main>

  <aside class="docs-toc-rail" aria-label="Page sections">
    <app-docs-toc />
  </aside>
</div>

@if (themeOpen()) {
  <app-theme-panel (closed)="themeOpen.set(false)" />
}
