<el-container class="docs-shell" size="full" [padded]="false">
  <header class="docs-header">
    <a routerLink="/" class="docs-header__brand">
      <span class="docs-header__logo">NgElemental</span>
      <span class="docs-header__version">v{{ version }}</span>
    </a>

    <nav class="docs-header__links" aria-label="Site">
      <a
        routerLink="/docs"
        class="docs-header__link docs-header__link--current"
        aria-current="page"
      >Docs</a>
      <a routerLink="/docs/components/button" class="docs-header__link">
        Components
      </a>
      <a
        href="https://github.com/AtulFalle/ng-elemental"
        target="_blank"
        rel="noopener"
        class="docs-header__link"
      >GitHub</a>
    </nav>

    <div class="docs-header__actions">
      <app-docs-search />
      <el-separator class="docs-header__rule" orientation="vertical" />
      <div class="docs-header__tools">
        <app-docs-theme-toggle />
        <span
          class="docs-header__theme"
          [class.docs-header__theme--custom]="docsTheme.isCustom()"
        >
          <el-button
            variant="icon"
            size="sm"
            iconStart="palette"
            [ariaLabel]="themeTriggerLabel()"
            [elTooltip]="themeTriggerLabel()"
            (click)="themeOpen.set(true)"
          />
        </span>
      </div>
    </div>
  </header>

  <el-grid class="docs-body" gap="0" [columnsTemplate]="bodyColumns()">
    <aside class="docs-sidebar">
      <el-nav
        appearance="rail"
        size="sm"
        [value]="activePath()"
        (valueChange)="onNavValueChange($event)"
        ariaLabel="Documentation"
      >
        @for (section of sections; track section.title) {
          <el-nav-heading>{{ section.title }}</el-nav-heading>
          @for (item of section.items; track item.path) {
            <el-nav-item [value]="item.path" [label]="item.label" />
          }
        }
      </el-nav>
    </aside>

    <main class="docs-main">
      <router-outlet />
    </main>

    @if (showToc()) {
      <aside class="docs-toc-rail" aria-label="Page sections">
        <app-docs-toc />
      </aside>
    }
  </el-grid>
</el-container>

<app-theme-panel [(open)]="themeOpen" />
