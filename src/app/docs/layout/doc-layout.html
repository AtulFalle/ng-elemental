<div class="docs-shell">
  <aside class="docs-sidebar">
    <a routerLink="/" class="docs-back" aria-label="Back to home">← Home</a>
    <a routerLink="/docs" class="docs-brand">NgElemental</a>
    <p class="docs-tagline">Copy-paste Angular components</p>

    @for (section of nav; track section.title) {
      <nav class="docs-nav-section" [attr.aria-label]="section.title">
        <h2>{{ section.title }}</h2>
        <ul>
          @for (item of section.items; track item.path) {
            <li>
              <a
                routerLink="{{ item.path }}"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: item.path === '/docs' }"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    }

    <button
      type="button"
      class="docs-theme-open"
      (click)="themeOpen.set(true)"
    >
      Theme
      @if (docsTheme.isCustom()) {
        <span class="docs-theme-open__hint">custom theme on</span>
      }
    </button>
  </aside>

  <main class="docs-main">
    <router-outlet />
  </main>
</div>

@if (themeOpen()) {
  <app-theme-panel (closed)="themeOpen.set(false)" />
}
