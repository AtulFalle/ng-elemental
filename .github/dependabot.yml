version: 2
updates:
  # npm dependencies — one weekly PR for minor/patch, majors stay separate
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
    ignore:
      # Major Angular version bumps require intentional migration
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — one weekly PR for all workflow bumps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
