# GitHub label definitions for ng-elemental.
# Synced automatically by .github/workflows/sync-labels.yml on push to master.
# Manual sync: Actions → Sync labels → Run workflow

# Scope — where the change lives (auto-applied on PRs via labeler.yml)
- name: area:cli
  color: '1D4ED8'
  description: CLI package (packages/cli)

- name: area:ui
  color: '7C3AED'
  description: UI component source (packages/ui)

- name: area:docs
  color: '059669'
  description: Documentation site, Storybook, and docs content

- name: area:ci
  color: '0E7490'
  description: GitHub Actions and CI configuration

- name: area:infra
  color: '6366F1'
  description: Workspace tooling (Nx, ESLint, TypeScript, npm)

- name: area:release
  color: 'B45309'
  description: Release, changelog, and npm publish

# Type — nature of the change (manual on PRs; type:docs auto on markdown)
- name: type:feature
  color: '16A34A'
  description: New feature or component

- name: type:bug
  color: 'DC2626'
  description: Bug fix

- name: type:docs
  color: '0891B2'
  description: Documentation-only change

- name: type:chore
  color: 'A16207'
  description: Maintenance, tooling, or housekeeping

- name: type:breaking
  color: 'BE123C'
  description: Breaking change for consumers

# CI control
- name: ci:full
  color: 'EA580C'
  description: Run full CI on this PR instead of affected-only checks

# Deprecated (remove from GitHub after sync): needs:full-ci, type:bugfix, bug, enhancement
