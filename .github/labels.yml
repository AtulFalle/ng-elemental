# GitHub label definitions for ng-elemental.
# Synced automatically by .github/workflows/sync-labels.yml on push to master.
# Manual sync: Actions → Sync labels → Run workflow

# Scope — where the change lives (auto-applied on PRs via labeler.yml)
- name: area:cli
  color: '1D4ED8'
  description: CLI package (packages/cli)

- name: area:mcp
  color: '0F766E'
  description: MCP package (packages/mcp)

- name: area:ui
  color: '7C3AED'
  description: UI component source (packages/ui)

- name: area:docs
  color: '059669'
  description: Documentation site, Storybook, and docs content

- name: area:ci
  color: '0E7490'
  description: GitHub Actions and CI configuration

- name: area:infra
  color: '6366F1'
  description: Workspace tooling (Nx, ESLint, TypeScript, npm)

- name: area:release
  color: 'B45309'
  description: Release, changelog, and npm publish

# Type — nature of the change (manual on PRs; type:docs auto on markdown)
- name: type:feature
  color: '16A34A'
  description: New feature or component

- name: type:bug
  color: 'DC2626'
  description: Bug fix

- name: type:docs
  color: '0891B2'
  description: Documentation-only change

- name: type:chore
  color: 'A16207'
  description: Maintenance, tooling, or housekeeping

- name: type:breaking
  color: 'BE123C'
  description: Breaking change for consumers

# Accessibility
- name: accessibility
  color: '7C3AED'
  description: WCAG, ARIA, keyboard navigation, or screen reader issue

# Community / triage
- name: good first issue
  color: '7057FF'
  description: Good entry point for new contributors

- name: help wanted
  color: '008672'
  description: Extra attention or outside help needed

# Priority
- name: priority:high
  color: 'B91C1C'
  description: Blocking or affecting many users

- name: priority:medium
  color: 'D97706'
  description: Important but not blocking

- name: priority:low
  color: '6B7280'
  description: Nice to have

# Status
- name: status:needs-repro
  color: 'F59E0B'
  description: Cannot reproduce — waiting for a reproduction case

- name: status:in-progress
  color: '2563EB'
  description: Actively being worked on

- name: status:blocked
  color: 'DC2626'
  description: Waiting on a dependency, decision, or upstream fix

- name: status:wontfix
  color: '6B7280'
  description: Out of scope or intentionally not addressed

# Type — issue classification
- name: type:accessibility
  color: '7C3AED'
  description: Accessibility bug or improvement

- name: type:mcp
  color: '0F766E'
  description: MCP server bug or improvement

- name: type:cli
  color: '1D4ED8'
  description: CLI bug or improvement

- name: type:documentation
  color: '0891B2'
  description: Documentation bug or improvement

# CI control
- name: ci:full
  color: 'EA580C'
  description: Run full CI on this PR instead of affected-only checks

# Deprecated (remove from GitHub after sync): needs:full-ci, type:bugfix, bug, enhancement
