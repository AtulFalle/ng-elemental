'area:cli':
  - changed-files:
      - any-glob-to-any-file: 'packages/cli/**'

'area:mcp':
  - changed-files:
      - any-glob-to-any-file: 'packages/mcp/**'

'area:ui':
  - changed-files:
      - any-glob-to-any-file: 'packages/ui/**'

'area:docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'public/**'
          - '.storybook/**'

'area:ci':
  - changed-files:
      - any-glob-to-any-file: '.github/**'

'area:infra':
  - changed-files:
      - any-glob-to-any-file:
          - 'nx.json'
          - 'package.json'
          - 'package-lock.json'
          - 'tsconfig*.json'
          - 'eslint*.mjs'
          - 'vitest.config.*'
          - '.nxignore'
          - '.prettierrc'
          - '.prettierignore'
          - 'chromatic.config.json'

'area:release':
  - changed-files:
      - any-glob-to-any-file:
          - 'CHANGELOG.md'
          - '.github/workflows/prepare-release.yml'
          - '.github/workflows/publish-release.yml'
          - '.github/scripts/**'

'type:docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
          - 'src/app/docs/**'
