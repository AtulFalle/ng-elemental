name: Feature request
description: Suggest a new component or improvement
title: "[Feature]: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve and how NgElemental could help.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you building, and what is missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the component, API, or workflow you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false
