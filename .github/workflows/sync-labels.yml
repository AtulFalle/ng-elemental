name: Sync labels

on:
  push:
    branches: [master, main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync GitHub labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply label definitions
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
