name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi

          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## " ver "($| \\()" { capture = 1; next }
            /^## / && capture { exit }
            capture { print }
          ' CHANGELOG.md)"
          NOTES="$(printf '%s\n' "$NOTES" | sed '/./,$!d')"

          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi

          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --verify-tag \
            "${PRERELEASE_ARGS[@]}"
