name: Publish Release

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (example: 0.0.3)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'area:release'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm
        run: npm install -g npm@11.17.0

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./packages/cli/package.json').version")"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CLI="$(node -p "require('./packages/cli/package.json').version")"
          MCP="$(node -p "require('./packages/mcp/package.json').version")"

          if [ "$CLI" != "$VERSION" ]; then
            echo "packages/cli/package.json is $CLI, expected $VERSION"
            exit 1
          fi
          if [ "$MCP" != "$VERSION" ]; then
            echo "packages/mcp/package.json is $MCP, expected $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build CLI and MCP
        run: npx nx run-many -t build --projects=cli,mcp

      - name: Verify README in publish output
        run: |
          if [ ! -f dist/packages/cli/README.md ]; then
            echo "dist/packages/cli/README.md is missing. npm will not show a package README."
            exit 1
          fi
          if [ ! -f dist/packages/mcp/README.md ]; then
            echo "dist/packages/mcp/README.md is missing. npm will not show a package README."
            exit 1
          fi
          if [ ! -f dist/packages/mcp/guidelines.md ]; then
            echo "dist/packages/mcp/guidelines.md is missing."
            exit 1
          fi

      - name: Publish @ng-elemental/cli
        id: publish
        working-directory: dist/packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          PUBLISHED="$(npm view @ng-elemental/cli version 2>/dev/null || true)"

          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "Version $VERSION is already on npm. Skipping publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm publish --access public --provenance
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Publish @ng-elemental/mcp
        working-directory: dist/packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          PUBLISHED="$(npm view @ng-elemental/mcp version 2>/dev/null || true)"

          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "Version $VERSION is already on npm. Skipping MCP publish."
            exit 0
          fi

          npm publish --access public --provenance

      - name: Update release tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            exit 0
          fi

          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            /^## \\[/ && capture { exit }
            capture { print }
          ' CHANGELOG.md)"
          NOTES="$(printf '%s\n' "$NOTES" | sed '/./,$!d')"

          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --verify-tag
