name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  NX_DAEMON: 'false'

jobs:
  ci:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Set Nx scope
        id: nx-scope
        env:
          FULL_CI: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$FULL_CI" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=affected" >> "$GITHUB_OUTPUT"
          fi

      - name: Show affected projects
        if: steps.nx-scope.outputs.mode == 'affected'
        run: |
          echo "Affected projects:"
          npx nx show projects --affected --withTarget=lint || true
          echo ""
          echo "Planned targets: lint, stylelint, build, test"

      - name: Lint
        run: |
          if [ "${{ steps.nx-scope.outputs.mode }}" = "full" ]; then
            npx nx run-many -t lint
          else
            npx nx affected -t lint
          fi

      - name: Stylelint
        run: |
          if [ "${{ steps.nx-scope.outputs.mode }}" = "full" ]; then
            npx nx run-many -t stylelint
          else
            npx nx affected -t stylelint
          fi

      - name: Build
        run: |
          if [ "${{ steps.nx-scope.outputs.mode }}" = "full" ]; then
            npx nx run-many -t build
          else
            npx nx affected -t build
          fi

      - name: Test and e2e
        run: |
          if [ "${{ steps.nx-scope.outputs.mode }}" = "full" ]; then
            npx nx run-many -t test
          else
            npx nx affected -t test
          fi
