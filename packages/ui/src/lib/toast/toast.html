<div [class]="rootClass()">
  @if (iconName()) {
    <span class="el-toast__icon">
      <el-icon [name]="iconName()!" size="sm" />
    </span>
  }
  <div class="el-toast__body">
    @if (title()) {
      <div class="el-toast__title">{{ title() }}</div>
    }
    <div class="el-toast__message">
      <ng-content />
    </div>
  </div>
  @if (dismissible()) {
    <el-button
      class="el-toast__close"
      variant="icon"
      size="sm"
      iconStart="xmark"
      ariaLabel="Dismiss"
      (click)="onDismiss()"
    />
  }
</div>
