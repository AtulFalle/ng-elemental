<div [class]="rootClass()">
  <svg
    class="el-progress-circle__svg"
    viewBox="0 0 36 36"
    aria-hidden="true"
    focusable="false"
  >
    <circle
      class="el-progress-circle__track"
      cx="18"
      cy="18"
      r="15.9155"
      fill="none"
    />
    <circle
      class="el-progress-circle__fill"
      cx="18"
      cy="18"
      r="15.9155"
      fill="none"
      [attr.stroke-dasharray]="strokeDasharray"
      [attr.stroke-dashoffset]="dashOffset()"
    />
  </svg>
  @if (showLabel()) {
    <span class="el-progress-circle__label">{{ labelText() }}</span>
  }
</div>
