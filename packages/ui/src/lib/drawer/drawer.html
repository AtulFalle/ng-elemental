@if (open()) {
  <div
    class="el-drawer-backdrop"
    [style.z-index]="zIndex()"
    (pointerdown)="onBackdrop($event)"
  ></div>
  <div
    #panel
    class="el-drawer"
    [class.el-drawer--sm]="size() === 'sm'"
    [class.el-drawer--md]="size() === 'md'"
    [class.el-drawer--lg]="size() === 'lg'"
    [class.el-drawer--left]="side() === 'left'"
    [class.el-drawer--right]="side() === 'right'"
    [style.z-index]="panelZ()"
    role="dialog"
    aria-modal="true"
    [id]="'el-drawer-panel-' + titleId"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-describedby]="ariaDescribedBy() || null"
    tabindex="-1"
    (keydown)="onPanelKeydown($event)"
  >
    <div class="el-drawer__header">
      <div class="el-drawer__title" [id]="titleId">
        <ng-content select="[elDrawerHeader]" />
        @if (title()) {
          <span class="el-drawer__title-text">{{ title() }}</span>
        }
      </div>
      @if (closable()) {
        <el-button
          class="el-drawer__close"
          variant="icon"
          size="sm"
          iconStart="xmark"
          ariaLabel="Close"
          (click)="close()"
        />
      }
    </div>
    <div class="el-drawer__content">
      <ng-content select="[elDrawerContent]" />
    </div>
    <div class="el-drawer__footer">
      <ng-content select="[elDrawerFooter]" />
    </div>
  </div>
}
